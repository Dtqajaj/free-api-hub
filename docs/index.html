<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free API Hub · 免费 API 索引</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--txt:#e6edf3;--dim:#8b949e;--acc:#2f81f7;--ok:#3fb950;--warn:#d29922}
body{background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:0 0 60px}
header{position:sticky;top:0;z-index:10;background:rgba(13,17,23,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:16px 20px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:19px;font-weight:600;margin-bottom:2px}
h1 span{color:var(--acc)}
.sub{font-size:12px;color:var(--dim);margin-bottom:14px}
.sub b{color:var(--ok);font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 12px;color:var(--txt);font-size:14px;outline:none}
input[type=text]:focus{border-color:var(--acc)}
select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 10px;color:var(--txt);font-size:13px;outline:none;max-width:200px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 14px;color:var(--dim);font-size:13px;cursor:pointer;user-select:none;white-space:nowrap}
.chip.on{border-color:var(--ok);color:var(--ok);background:rgba(63,185,80,.1)}
.meta{padding:12px 20px;font-size:12px;color:var(--dim)}
main{max-width:1100px;margin:0 auto;padding:0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px}
.card:hover{border-color:#484f58}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.name{font-size:15px;font-weight:600;color:var(--acc);text-decoration:none}
.name:hover{text-decoration:underline}
.tag{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.tag.nokey{color:var(--ok);border-color:rgba(63,185,80,.4)}
.tag.key{color:var(--warn);border-color:rgba(210,153,34,.4)}
.tag.cors{color:var(--acc);border-color:rgba(47,129,247,.4)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.ok{background:var(--ok)}
.dot.dead{background:#f85149;opacity:.6}
.dot.na{background:#484f58}
.desc{color:var(--dim);font-size:13px;margin-bottom:8px}
.url{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:#79c0ff;word-break:break-all;background:#0b0f14;border:1px solid var(--line);border-radius:5px;padding:6px 8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.url span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp{background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--dim);font-size:11px;padding:2px 8px;cursor:pointer;flex-shrink:0}
.cp:hover{color:var(--ok);border-color:var(--ok)}
.empty{text-align:center;color:var(--dim);padding:60px 0}
footer{max-width:1100px;margin:30px auto 0;padding:0 20px;color:var(--dim);font-size:12px;line-height:1.9}
footer a{color:var(--acc);text-decoration:none}
.more{display:block;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--txt);padding:10px;cursor:pointer;margin-top:6px}
.more:hover{border-color:var(--acc)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Free API <span>Hub</span></h1>
    <div class="sub">免费 API 索引 · <b id="c-nokey">-</b> 个免 Key 直连 · 共 <b id="c-total">-</b> 个 · <b id="c-cat">-</b> 个分类 · 数据每 6 小时自动更新</div>
    <div class="bar">
      <input type="text" id="q" placeholder="搜索名称 / 说明 / 分类，例如 weather、汇率、AI">
      <select id="cat"><option value="">全部分类</option></select>
      <div class="chip on" id="nokey">只看免 Key</div>
      <a class="chip" href="./llm.html" style="text-decoration:none">LLM 怎么用 →</a>
    </div>
  </div>
</header>
<div class="meta" id="meta"></div>
<main><div id="list"></div></main>
<footer>
  <div>API 端点：<a href="./api/v1/index.json">/api/v1/index.json</a> · <a href="./api/v1/apis.json">apis.json</a> · <a href="./api/v1/nokey.json">nokey.json</a> · <a href="./api/v1/llm.json">llm.json</a> · <a href="./api/v1/categories.json">categories.json</a> · <a href="./api/v1/stats.json">stats.json</a></div>
  <div>raw 直连（可跨域）：<code id="rawbase"></code></div>
  <div>数据来源：public-apis / public-api-lists 社区维护，自动解析生成。</div>
</footer>
<script>
(function(){
  var ALL=[], VIEW=[], LIMIT=60, shown=0, STATUS={};
  var list=document.getElementById('list');
  var q=document.getElementById('q'), cat=document.getElementById('cat');
  var nokeyChip=document.getElementById('nokey'), onlyNoKey=true;

  document.getElementById('rawbase').textContent =
    location.origin + location.pathname.replace(/\/[^\/]*$/,'') + '/api/v1/';

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  function render(reset){
    if(reset){ list.innerHTML=''; shown=0; }
    var frag=document.createDocumentFragment();
    var end=Math.min(shown+LIMIT, VIEW.length);
    for(var i=shown;i<end;i++){
      var a=VIEW[i];
      var card=document.createElement('div');
      card.className='card';
      var authCls = a.auth==='No' ? 'nokey' : 'key';
      var authTxt = a.auth==='No' ? '免 Key' : a.auth;
      var corsTxt = /yes/i.test(a.cors) ? '<span class="tag cors">CORS</span>' : '';
      var st = STATUS[a.id];
      var dotCls = 'na', dotTip = '未探测';
      if(st){ dotCls = st.alive?'ok':'dead'; dotTip = st.alive?('在线 '+st.ms+'ms'):('不可达 '+st.code); }
      card.innerHTML =
        '<div class="top"><span class="dot '+dotCls+'" title="'+esc(dotTip)+'"></span>'+
        '<a class="name" href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(a.name)+'</a>'+
        '<span class="tag">'+esc(a.category)+'</span>'+
        '<span class="tag '+authCls+'">'+esc(authTxt)+'</span>'+corsTxt+'</div>'+
        '<div class="desc">'+esc(a.description)+'</div>'+
        '<div class="url"><span>'+esc(a.url)+'</span><button class="cp" data-u="'+esc(a.url)+'">复制</button></div>';
      frag.appendChild(card);
    }
    list.appendChild(frag);
    shown=end;
    var old=document.getElementById('moreBtn');
    if(old) old.remove();
    if(shown<VIEW.length){
      var b=document.createElement('button');
      b.id='moreBtn'; b.className='more';
      b.textContent='加载更多（还有 '+(VIEW.length-shown)+' 条）';
      b.onclick=function(){ b.remove(); render(false); };
      list.appendChild(b);
    }
    if(VIEW.length===0){
      list.innerHTML='<div class="empty">没有匹配的 API，换个关键词试试</div>';
    }
  }

  function filter(){
    var kw=q.value.trim().toLowerCase();
    var c=cat.value;
    VIEW=ALL.filter(function(a){
      if(onlyNoKey && a.auth!=='No') return false;
      if(c && a.category!==c) return false;
      if(!kw) return true;
      return (a.name+' '+a.description+' '+a.category+' '+a.url).toLowerCase().indexOf(kw)>=0;
    });
    document.getElementById('meta').textContent='命中 '+VIEW.length+' 条';
    render(true);
  }

  list.addEventListener('click',function(e){
    var t=e.target;
    if(t.className!=='cp') return;
    var u=t.getAttribute('data-u');
    if(navigator.clipboard){
      navigator.clipboard.writeText(u).then(function(){ t.textContent='已复制'; setTimeout(function(){t.textContent='复制';},1200); });
    }else{
      var ta=document.createElement('textarea'); ta.value=u; document.body.appendChild(ta);
      ta.select(); try{document.execCommand('copy');}catch(x){} document.body.removeChild(ta);
      t.textContent='已复制'; setTimeout(function(){t.textContent='复制';},1200);
    }
  });

  var timer=null;
  q.addEventListener('input',function(){ clearTimeout(timer); timer=setTimeout(filter,180); });
  cat.addEventListener('change',filter);
  nokeyChip.addEventListener('click',function(){
    onlyNoKey=!onlyNoKey;
    nokeyChip.className='chip'+(onlyNoKey?' on':'');
    filter();
  });

  fetch('./api/v1/status.json').then(function(r){return r.ok?r.json():null;}).then(function(s){
    if(s && s.items) STATUS = s.items;
  }).catch(function(){});

  fetch('./api/v1/apis.json').then(function(r){return r.json();}).then(function(data){
    ALL=data;
    var cats={};
    data.forEach(function(a){ cats[a.category]=(cats[a.category]||0)+1; });
    Object.keys(cats).sort().forEach(function(c){
      var o=document.createElement('option');
      o.value=c; o.textContent=c+' ('+cats[c]+')';
      cat.appendChild(o);
    });
    document.getElementById('c-total').textContent=data.length;
    document.getElementById('c-nokey').textContent=data.filter(function(a){return a.auth==='No';}).length;
    document.getElementById('c-cat').textContent=Object.keys(cats).length;
    filter();
  }).catch(function(e){
    list.innerHTML='<div class="empty">数据加载失败：'+esc(e.message)+'</div>';
  });
})();
</script>
</body>
</html>
