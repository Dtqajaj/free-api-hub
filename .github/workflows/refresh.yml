name: refresh-api-index

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'data/**'

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build index
        run: python3 scripts/build.py

      - name: Check endpoints
        run: python3 scripts/check.py --limit 400 --workers 40 || true

      - name: Commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/api data/cache
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh api index $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
